# KNF-7 / KNF-8: tes otomatis dan build CostStruct.exe di Windows sungguhan (runner windows-latest).
# Hasil build (folder CostStruct siap pakai) dapat diunduh dari tab Actions -> run -> Artifacts.
name: Windows - tes & build .exe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Info sistem
        run: |
          python -c "import platform, os, locale; print(platform.platform(), platform.machine(), os.cpu_count(), 'CPU', locale.getpreferredencoding())"
          python -c "import PySide6, ifcopenshell; print('PySide6', PySide6.__version__, '| IfcOpenShell', ifcopenshell.version)"

      - name: Tes otomatis (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

      - name: Ukur kinerja KNF-1 / KNF-2
        if: success() || failure()  # tetap dijalankan walau ada tes gagal: semua masalah terlihat dalam satu run
        run: python tools/ukur_kinerja.py data/AC20-FZK-Haus.ifc data/Duplex_A_20110907.ifc data/SampleStructuralModel.ifc

      - name: Build CostStruct.exe + uji mandiri hasil build
        if: success() || failure()  # tetap dijalankan walau ada tes gagal: semua masalah terlihat dalam satu run
        run: python tools/build_exe.py

      - name: Unggah aplikasi Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CostStruct-windows
          path: dist/CostStruct
          retention-days: 14

      - name: Unggah laporan uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-uji-windows
          path: |
            build/uji_mandiri
            hasil_kinerja.csv
          if-no-files-found: ignore
          retention-days: 14
